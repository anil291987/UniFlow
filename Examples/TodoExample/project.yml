name: TodoExample
options:
  bundleIdPrefix: com.uniflow
  deploymentTarget:
    macOS: "12.0"

packages:
  UniFlow:
    path: ../../

targets:
  TodoExample:
    type: application
    platform: macOS
    sources:
      - path: Sources/TodoExample
    dependencies:
      - package: UniFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniflow.TodoExample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"

  TodoExampleUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/TodoExampleUITests
    dependencies:
      - target: TodoExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: TodoExample

schemes:
  TodoExample:
    build:
      targets:
        TodoExample: all
        TodoExampleUITests: [test]
    test:
      targets:
        - TodoExampleUITests
    run:
      config: Debug
