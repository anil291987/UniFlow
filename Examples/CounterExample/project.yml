name: CounterExample
options:
  bundleIdPrefix: com.uniflow
  deploymentTarget:
    macOS: "12.0"

packages:
  UniFlow:
    path: ../../

targets:
  CounterExample:
    type: application
    platform: macOS
    sources:
      - path: Sources/CounterExample
    dependencies:
      - package: UniFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uniflow.CounterExample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"

  CounterExampleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/CounterExampleTests
    dependencies:
      - target: CounterExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

  CounterExampleUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/CounterExampleUITests
    dependencies:
      - target: CounterExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: CounterExample

schemes:
  CounterExample:
    build:
      targets:
        CounterExample: all
        CounterExampleTests: [test]
        CounterExampleUITests: [test]
    test:
      targets:
        - CounterExampleTests
        - CounterExampleUITests
    run:
      config: Debug
